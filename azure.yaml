name: azd-starter
hooks:
  preprovision:
    shell: pwsh
    run: 'dotnet run --project ./hooks/lets-encrypt/

      '
  postprovision:
    shell: pwsh
    run: 'dotnet run --project ./hooks/cog-search-index-and-indexer/cog-search-index-and-indexer/

      '
services:
  internal-api:
    language: ts
    project: ./apps/sample-private-api
    host: appservice
    hooks:
      prerestore:
        shell: pwsh
        run: npm i
  locked-down-bot:
    language: dotnet
    project: ./apps/bot-composer/LockedDownBot/LockedDownBot/LockedDownBot.csproj
    host: appservice
  document-cracker:
    language: dotnet
    project: ./apps/content-splitter-function/ContentSplitter/ContentSplitter.csproj
    host: appservice
metadata:
  template: LockedDownChatBot@0.0.1-beta
